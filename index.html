<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Avatar Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/reset.css"/>
  <link rel="stylesheet" href="css/vars.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/sidebar.css"/>
  <link rel="stylesheet" href="css/stage.css"/>
  <link rel="stylesheet" href="css/shop.css"/>
  <link rel="stylesheet" href="css/controls.css"/>
  <link rel="stylesheet" href="css/toast.css"/>
  <link rel="stylesheet" href="css/anim.css"/>
</head>
<body>

  <!-- LEFT ICON SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect x="2" y="2" width="10" height="10" rx="2" fill="#00B4D8"/>
          <rect x="14" y="2" width="10" height="10" rx="2" fill="#0077B6"/>
          <rect x="2" y="14" width="10" height="10" rx="2" fill="#0077B6"/>
          <rect x="14" y="14" width="10" height="10" rx="2" fill="#00B4D8"/>
        </svg>
      </div>
    </div>

    <div class="sidebar-nav">
      <button class="nav-btn active" data-cat="hair" title="Hair">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M12 2C8 2 5 5 5 9c0 2 .7 3.8 2 5l-1 8h12l-1-8c1.3-1.2 2-3 2-5 0-4-3-7-7-7z" fill="currentColor"/></svg>
        <span>Hair</span>
      </button>
      <button class="nav-btn" data-cat="face" title="Face">
        <svg class="nav-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/><circle cx="15" cy="10" r="1.5" fill="currentColor"/><path d="M9 15c1 1.5 5 1.5 6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        <span>Face</span>
      </button>
      <button class="nav-btn" data-cat="glasses" title="Glasses">
        <svg class="nav-ico" viewBox="0 0 24 24"><rect x="2" y="9" width="8" height="6" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><rect x="14" y="9" width="8" height="6" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><line x1="10" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="2"/></svg>
        <span>Glasses</span>
      </button>
      <button class="nav-btn" data-cat="beard" title="Beard">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M5 13c0 5 3 8 7 8s7-3 7-8v-2H5v2z" fill="currentColor" opacity=".9"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span>Beard</span>
      </button>
      <button class="nav-btn" data-cat="clothes" title="Clothes">
        <svg class="nav-ico" viewBox="0 0 24 24"><path d="M9 2L6 5l-4 2 2 3 3-1v13h14V9l3 1 2-3-4-2-3-3H9z" fill="currentColor"/></svg>
        <span>Clothes</span>
      </button>
      <button class="nav-btn" data-cat="skin" title="Skin">
        <svg class="nav-ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span>Skin</span>
      </button>
    </div>

    <div class="sidebar-bottom">
      <button class="side-action" id="btnRandomize" title="Randomize">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="side-action side-action--reset" id="btnReset" title="Reset">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 12a9 9 0 109-9H3m0 0l3 3m-3-3L3 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main-area">

    <!-- STAGE (CENTER) -->
    <section class="stage">
      <div class="stage-bg">
        <div class="stage-floor"></div>
        <div class="stage-spotlight"></div>
      </div>

      <div class="stage-avatar-wrap" id="stageWrap">
        <div class="avatar-shadow"></div>
        <div class="avatar-frame">
          <canvas id="avatarCanvas" width="32" height="32"></canvas>
        </div>
      </div>

      <div class="stage-footer">
        <div class="stage-controls">
          <button class="ctrl-pill" id="zoomOut">−</button>
          <span class="ctrl-pill ctrl-pill--label" id="zoomLabel">100%</span>
          <button class="ctrl-pill" id="zoomIn">+</button>
        </div>
        <button class="save-btn" id="btnDownload">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Save Avatar
        </button>
      </div>

      <!-- BG PICKER -->
      <div class="bg-picker">
        <span class="bg-label">Scene</span>
        <div class="bg-options" id="bgOptions"></div>
      </div>
    </section>

    <!-- RIGHT SHOP PANEL -->
    <aside class="shop-panel" id="shopPanel">

      <div class="shop-header">
        <div class="shop-category-title" id="shopCatTitle">Hair Style</div>
        <div class="shop-category-sub" id="shopCatSub">Pick a style</div>
      </div>

      <!-- COLOR ROW (shown for relevant cats) -->
      <div class="color-strip" id="colorStrip">
        <div class="color-strip-label">Color</div>
        <div class="color-row" id="colorRow"></div>
      </div>

      <!-- ITEM GRID -->
      <div class="shop-grid" id="shopGrid"></div>

    </aside>
  </main>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMsg">Done</span>
  </div>

  <!-- SCRIPTS (order matters) -->
  <script src="js/state.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/draw-utils.js"></script>
  <script src="js/draw-base.js"></script>
  <script src="js/draw-hair.js"></script>
  <script src="js/draw-eyes.js"></script>
  <script src="js/draw-beard.js"></script>
  <script src="js/draw-glasses.js"></script>
  <script src="js/draw-clothes.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/thumbnails.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/zoom.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/download.js"></script>
  <script src="js/randomize.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
